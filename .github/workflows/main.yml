name: Deploy
on:
 push:  
    branches:
     - dev
jobs:
 deploy:
   runs-on: ubuntu-latest
   steps:
     - uses: actions/checkout@v3
     - name: Deploy to server
       uses: appleboy/ssh-action@master
       with:
         host: ${{ secrets.EC2_HOST }}
         username: ubuntu
         port: 22
         key: ${{ secrets.EC2_KEY }}
         script: "bash /var/www/test-devOps-git/deploy.sh" 
